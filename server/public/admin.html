<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Keira's Diner</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --dark-brown: #3e2c1f; --gold: #c9a74b; --cream: #fdf8f0;
      --orange: #e67e22; --white: #fff; --green: #27ae60; --red: #c0392b;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--cream); color: var(--dark-brown); line-height: 1.6;
    }
    .navbar {
      background: var(--dark-brown); color: var(--cream);
      padding: 14px 24px; display: flex; justify-content: space-between;
      align-items: center; box-shadow: var(--shadow);
    }
    .navbar h1 { color: var(--gold); font-size: 1.3rem; letter-spacing: 1px; }
    .navbar button {
      background: var(--gold); color: var(--dark-brown); border: none;
      padding: 8px 18px; border-radius: 30px; font-weight: 700;
      cursor: pointer; font-size: 0.85rem;
    }
    .navbar button:hover { background: var(--orange); color: var(--white); }
    .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px; margin-bottom: 30px;
    }
    .stat-card {
      background: var(--white); padding: 22px; border-radius: 14px;
      box-shadow: var(--shadow); text-align: center;
    }
    .stat-card h3 {
      font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;
      color: #777; margin-bottom: 8px;
    }
    .stat-card .value { font-size: 1.8rem; font-weight: 700; color: var(--gold); }
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .filter-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      padding: 7px 16px; border-radius: 30px; border: 2px solid var(--gold);
      background: var(--white); color: var(--dark-brown); font-size: 0.8rem;
      font-weight: 600; cursor: pointer;
    }
    .filter-btn:hover, .filter-btn.active { background: var(--gold); color: var(--white); }
    .orders-list { display: flex; flex-direction: column; gap: 16px; }
    .order-card {
      background: var(--white); border-radius: 14px; padding: 22px;
      box-shadow: var(--shadow); border-left: 6px solid var(--gold);
    }
    .order-card.status-new { border-left-color: var(--orange); }
    .order-card.status-preparing { border-left-color: #f39c12; }
    .order-card.status-delivered { border-left-color: var(--green); }
    .order-card.status-cancelled { border-left-color: var(--red); opacity: 0.7; }
    .order-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 14px; flex-wrap: wrap; gap: 10px;
    }
    .order-id { font-size: 0.85rem; font-weight: 700; color: var(--gold); }
    .order-time { font-size: 0.8rem; color: #888; }
    .order-status {
      display: inline-block; padding: 4px 12px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
    }
    .status-new { background: #fff1e6; color: var(--orange); }
    .status-preparing { background: #fff8e1; color: #d68910; }
    .status-delivered { background: #e8f8ec; color: var(--green); }
    .status-cancelled { background: #fdecea; color: var(--red); }
    .order-customer {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px; margin-bottom: 14px; font-size: 0.9rem;
    }
    .order-items {
      background: var(--cream); border-radius: 10px;
      padding: 14px 16px; margin-bottom: 14px; list-style: none;
    }
    .order-items li {
      display: flex; justify-content: space-between;
      font-size: 0.88rem; padding: 4px 0; color: #555;
    }
    .order-items li.total {
      font-weight: 700; color: var(--dark-brown);
      border-top: 1px solid #e5ddd2; margin-top: 6px; padding-top: 8px;
    }
    .order-instructions {
      font-size: 0.85rem; color: #666; font-style: italic;
      margin-bottom: 14px; padding: 10px 14px; background: #fff7e6;
      border-radius: 8px; border-left: 3px solid var(--gold);
    }
    .order-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .order-actions button, .order-actions a {
      padding: 7px 16px; border-radius: 30px; font-size: 0.78rem;
      font-weight: 600; cursor: pointer; border: none;
      text-decoration: none; display: inline-flex; align-items: center;
      gap: 6px; font-family: inherit;
    }
    .btn-whatsapp { background: #25D366; color: var(--white); }
    .btn-whatsapp:hover { background: #1ebe57; }
    .btn-mark { background: var(--gold); color: var(--dark-brown); }
    .btn-mark:hover { background: var(--orange); color: var(--white); }
    .btn-delete { background: #fdecea; color: var(--red); }
    .btn-delete:hover { background: var(--red); color: var(--white); }
    .empty-state {
      text-align: center; padding: 60px 20px; background: var(--white);
      border-radius: 14px; box-shadow: var(--shadow);
    }
    .empty-state i { font-size: 3rem; color: var(--gold); margin-bottom: 14px; }
    .empty-state p { color: #777; }
  </style>
</head>
<body>

  <header class="navbar">
    <h1><i class="fas fa-utensils"></i> Keira's Diner - Admin</h1>
    <button onclick="loadOrders()"><i class="fas fa-sync-alt"></i> Refresh</button>
  </header>

  <div class="container">

    <div class="stats">
      <div class="stat-card"><h3>Total Orders</h3><div class="value" id="statTotal">0</div></div>
      <div class="stat-card"><h3>New Orders</h3><div class="value" id="statNew">0</div></div>
      <div class="stat-card"><h3>Delivered</h3><div class="value" id="statDelivered">0</div></div>
      <div class="stat-card"><h3>Total Revenue</h3><div class="value" id="statRevenue">KES 0</div></div>
    </div>

    <div class="toolbar">
      <h2>Orders</h2>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="new">New</button>
        <button class="filter-btn" data-filter="preparing">Preparing</button>
        <button class="filter-btn" data-filter="delivered">Delivered</button>
        <button class="filter-btn" data-filter="cancelled">Cancelled</button>
      </div>
    </div>

    <div class="orders-list" id="ordersList"></div>

  </div>

  <script>
    let allOrders = [];
    let currentFilter = 'all';

    async function loadOrders() {
      try {
        const res = await fetch('/api/orders');
        const data = await res.json();
        allOrders = data.orders || [];
        updateStats();
        renderOrders();
      } catch (err) {
        console.error('Failed to load orders:', err);
      }
    }

    function updateStats() {
      document.getElementById('statTotal').textContent = allOrders.length;
      document.getElementById('statNew').textContent = allOrders.filter(o => o.status === 'new').length;
      document.getElementById('statDelivered').textContent = allOrders.filter(o => o.status === 'delivered').length;
      const revenue = allOrders.filter(o => o.status !== 'cancelled')
        .reduce((sum, o) => sum + (o.total || 0), 0);
      document.getElementById('statRevenue').textContent = 'KES ' + revenue;
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleString();
    }

    function renderOrders() {
      const list = document.getElementById('ordersList');
      const filtered = currentFilter === 'all'
        ? allOrders
        : allOrders.filter(o => o.status === currentFilter);

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No orders to show.</p></div>';
        return;
      }

      list.innerHTML = filtered.map(order => {
        const itemsHtml = order.items.map(item =>
          `<li><span>${item.quantity} x ${item.name}</span><span>KES ${item.price * item.quantity}</span></li>`
        ).join('');

        const cleanPhone = order.phone.replace(/\D/g, '');
        const waLink = 'https://wa.me/' + cleanPhone + '?text=' +
          encodeURIComponent("Hello " + order.name + ", your order " + order.id + " at Keira's Diner is confirmed.");

        return `
          <div class="order-card status-${order.status}">
            <div class="order-header">
              <div>
                <div class="order-id">${order.id}</div>
                <div class="order-time">${formatDate(order.createdAt)}</div>
              </div>
              <span class="order-status status-${order.status}">${order.status}</span>
            </div>
            <div class="order-customer">
              <span><strong>Name:</strong> ${order.name}</span>
              <span><strong>Phone:</strong> ${order.phone}</span>
              <span><strong>Payment:</strong> ${order.payment}</span>
            </div>
            <ul class="order-items">
              ${itemsHtml}
              <li class="total"><span>Total</span><span>KES ${order.total}</span></li>
            </ul>
            ${order.instructions ? `<div class="order-instructions"><strong>Notes:</strong> ${order.instructions}</div>` : ''}
            <div class="order-actions">
              <a href="${waLink}" target="_blank" class="btn-whatsapp">
                <i class="fab fa-whatsapp"></i> Contact
              </a>
              <button class="btn-mark" onclick="updateStatus('${order.id}', 'preparing')">
                <i class="fas fa-fire"></i> Preparing
              </button>
              <button class="btn-mark" onclick="updateStatus('${order.id}', 'delivered')">
                <i class="fas fa-check"></i> Delivered
              </button>
              <button class="btn-delete" onclick="deleteOrder('${order.id}')">
                <i class="fas fa-trash"></i> Delete
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateStatus(id, status) {
      await fetch('/api/orders/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadOrders();
    }

    async function deleteOrder(id) {
      if (!confirm('Delete this order permanently?')) return;
      await fetch('/api/orders/' + id, { method: 'DELETE' });
      loadOrders();
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        renderOrders();
      });
    });

    loadOrders();
    setInterval(loadOrders, 15000);
  </script>

</body>
</html>cd
