<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Keira's Diner</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --dark-brown: #3e2c1f;
      --gold: #c9a74b;
      --cream: #fdf8f0;
      --orange: #e67e22;
      --white: #ffffff;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--cream);
      color: var(--dark-brown);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      background: var(--white);
      padding: 45px 40px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .login-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--gold);
      color: var(--white);
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    .login-box h1 {
      font-size: 1.6rem;
      color: var(--dark-brown);
      margin-bottom: 8px;
    }

    .login-box p {
      font-size: 0.92rem;
      color: #777;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--dark-brown);
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #e5ddd2;
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      background: var(--cream);
      color: var(--dark-brown);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 167, 75, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      background: var(--gold);
      color: var(--dark-brown);
      border: none;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      font-family: inherit;
    }

    .btn:hover {
      background: var(--orange);
      color: var(--white);
      transform: translateY(-2px);
    }

    .message {
      margin-top: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      min-height: 20px;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      font-size: 0.85rem;
      color: var(--orange);
      text-decoration: none;
      transition: color 0.3s;
    }

    .back-link:hover {
      color: var(--dark-brown);
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="login-icon">
      <i class="fas fa-lock"></i>
    </div>
    <h1>Admin Login</h1>
    <p>Enter your password to access the orders panel.</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter admin password" required autofocus>
      </div>

      <button type="submit" class="btn">
        <i class="fas fa-sign-in-alt"></i> Log In
      </button>

      <p class="message" id="loginMessage"></p>
    </form>

    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Site</a>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;

      if (!password) {
        loginMessage.textContent = 'Please enter your password.';
        loginMessage.style.color = '#c0392b';
        return;
      }

      loginMessage.textContent = 'Checking...';
      loginMessage.style.color = '#555';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password })
        });

        const data = await res.json();

        if (data.success && data.token) {
          // Save the token so the admin panel can use it
          localStorage.setItem('keiraAdminToken', data.token);
          loginMessage.textContent = 'Login successful. Redirecting...';
          loginMessage.style.color = '#27ae60';
          setTimeout(() => {
            window.location.href = '/admin.html';
          }, 600);
        } else {
          loginMessage.textContent = data.message || 'Incorrect password.';
          loginMessage.style.color = '#c0392b';
        }
      } catch (err) {
        loginMessage.textContent = 'Server not reachable. Please try again.';
        loginMessage.style.color = '#c0392b';
      }
    });
  </script>

</body>
</html>
